# Copy to <home>/config/projects/<project_id>.toml and chmod 600.
# Project IDs start with an ASCII letter/digit and contain only letters,
# digits, underscores and hyphens (maximum 128 characters).
# This overrides local settings only for this project.
[roles.planner]

[roles.critic]

# Use configure_project to save project-local planning.templates in private
# <home>/config/projects/<project_id>.json; select one with planning.workflow.
# Select a safe name, never a filesystem path.
# <home>/config/workflows/<name>.json is administrator-only shared customization,
# not a destination for project-scoped edits.
[planning]
clarification = "material"
workflow = "plan-review"
max_review_rounds = 3

# Set trusted/unattended through chat for authorized hands-off project work.
[execution]
mode = "restricted"
unattended = false
base_ref = "HEAD"
worker_difficulty = "hard"
max_parallel = 3
dependency_failure = "block"

# Configure worker preferences in <project-root>/.orchestrator/crew-dispatch.json.
# No worker model or effort is selected by default.
