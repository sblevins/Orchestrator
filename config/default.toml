# Tracked defaults. Put private changes in config/local.toml or config/projects/<id>.toml.
[supervisor]
poll_seconds = 1.0
heartbeat_seconds = 5.0
stale_seconds = 30.0
max_parallel = 2
monitor_interval_seconds = 60.0
monitor_batch_events = 50
# Shared execution safeguards, not per-role tuning.
task_timeout_seconds = 900
task_memory = "2G"
task_cpus = 1
frontend_memory = "2G"
frontend_cpus = 1

[planning]
structure = "graph"
workflow = "plan-review"
max_review_rounds = 3

[execution]
max_parallel = 3
dependency_failure = "block"

[personalization]
name = "User"
communication_style = "Concise, neutral, practical. No pirate language. Seek independent evidence, distinguish facts from assumptions, and explain complicated points in plain English. Never automatically approve code execution or permission requests."

[frontends]
preferred = "claude"
[frontends.claude]
command = ["claude"]
[frontends.pi]
command = ["pi"]

[workers]
enabled = true
[routing]
enabled = true
rules = []
[routing.first_mate]

[adapters.claude]
command = ["claude"]
[adapters.pi]
command = ["pi"]

[roles.orchestrator]
adapter = "claude"
model = "claude-sonnet-5-5"
effort = "low"
allowed_tools = ["Read", "Glob", "Grep"]
prompt_path = "roles/orchestrator.md"

[roles.planner]
adapter = "claude"
model = "claude-opus-5-5"
effort = "high"
allowed_tools = ["Read", "Glob", "Grep"]
prompt_path = "roles/planner.md"

[roles.critic]
adapter = "pi"
provider = "openai-codex"
model = "gpt-6-astra"
effort = "high"
allowed_tools = ["Read", "Glob", "Grep"]
prompt_path = "roles/critic.md"

[roles.monitor]
adapter = "claude"
model = "claude-opus-5-5"
effort = "high"
allowed_tools = ["Read", "Glob", "Grep"]
prompt_path = "roles/monitor.md"

# Every prompt is saved. Only exact routine queries skip starting a deep review.
[monitoring]
review_every_prompt = false
routine_prompts = ["/status", "/tasks", "/progress", "status", "progress", "what's the status", "what is the status", "what's the status of work", "what is the status of work", "how is it going", "show progress", "show the current status", "list running tasks"]

# Project-local overrides are editable through configure_project.
[permissions]
coordinator_approvals = true
require_write_approval = false
enforce_monitor_holds = true
